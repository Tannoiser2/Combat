# Esporta il progetto Godot per il Web e lo pubblica su GitHub Pages.
# Richiede Pages con source "GitHub Actions" nelle impostazioni del repo.
# Nota: le scansioni delle mappe non sono nel repo (copyright), quindi la
# build web gira sulla mini-mappa procedurale di fallback.
name: Deploy su GitHub Pages

# GitHub Pages pubblica solo dal branch di DEFAULT del repo (regola
# dell'ambiente github-pages). Il default e' main, quindi il deploy
# parte dai push su main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Installa gli export template
        # Il runner imposta HOME=/github/home, ma l'immagine tiene i
        # template in /root; serve anche la variante web "nothreads".
        run: |
          DEST=~/.local/share/godot/export_templates
          mkdir -p "$DEST"
          if [ -d /root/.local/share/godot/export_templates/4.3.stable ]; then
            cp -r /root/.local/share/godot/export_templates/4.3.stable "$DEST/"
          fi
          if [ ! -f "$DEST/4.3.stable/web_nothreads_release.zip" ]; then
            curl -sL -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
            unzip -q -o /tmp/templates.tpz -d /tmp
            mkdir -p "$DEST/4.3.stable"
            cp -r /tmp/templates/* "$DEST/4.3.stable/"
          fi
          ls "$DEST/4.3.stable" | grep web
      - name: Import risorse
        run: godot --headless --import || true
      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
      - name: Upload artefatto Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy su Pages
        id: deployment
        uses: actions/deploy-pages@v4
